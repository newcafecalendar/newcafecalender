<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新作カフェカレンダー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>☕ 新作カフェカレンダー</h1>
</header>

<section class="filters">
    <button
        class="filter-btn active"
        data-brand="all"
    >
        すべて
    </button>

    <button
        class="filter-btn"
        data-brand="Starbucks"
    >
        Starbucks
    </button>

    <button
        class="filter-btn"
        data-brand="TULLY'S"
    >
        TULLY'S
    </button>

    <button
        class="filter-btn"
        data-brand="コメダ"
    >
        コメダ
    </button>

    <button
        class="filter-btn"
        data-brand="Gong cha"
    >
        Gong cha
    </button>
</section>

<main>

    <section class="calendar-section">
        <h2>発売カレンダー</h2>

        <div id="calendar">
            読み込み中...
        </div>
    </section>

    <section class="upcoming-section">
        <h2>発売予定</h2>

        <div id="upcoming-list">
            読み込み中...
        </div>
    </section>

</main>

<footer>
    <p>© 新作カフェカレンダー</p>
</footer>

<script src="script.js"></script>

</body>
</html>
